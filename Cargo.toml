[package]
name = "rustc-dep-info"
version = "0.1.0"
edition = "2024"
authors = ["Mate J Kovacs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkovaxx/rustc-dep-info"
description = "Parse, print, and manipulate dep-info files used by rustc and cargo."
keywords = ["dep-info", "rustc", "cargo"]

[features]
testing = ["dep:arbitrary", "indexmap/arbitrary"]

[dependencies]
arbitrary = { version = "1", features = ["derive"], optional = true }
hex = "0.4"
indexmap = "2.14"
serde = "1"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
depinfo = "=0.7.10"
# The adapter's RNG call does not compile with Proptest 1.12.
proptest = "=1.9.0"
proptest-arbitrary-adapter = "0.1"
serde_json = "1"
